name: Publish Rust crates

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment: crates-io

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify versions match tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          test "$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "corrmatch") | .version')" = "$VERSION"

          test "$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "corrmatch-cli") | .version')" = "$VERSION"

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Authenticate to crates.io
        id: cratesio
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
        shell: bash
        run: |
          publish() {
            local crate="$1"

            for attempt in {1..10}; do
              echo "Publishing $crate (attempt $attempt)..."

              if cargo publish -p "$crate" --locked; then
                return 0
              fi

              sleep 15
            done

            return 1
          }

          # Dependency order matters.
          publish corrmatch
          publish corrmatch-cli
