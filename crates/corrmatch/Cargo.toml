[package]
name = "corrmatch"
version.workspace = true
description = "CPU-first template matching with ZNCC/SSD and coarse-to-fine pyramid search"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
categories = ["algorithms", "multimedia::images", "science"]
keywords = ["template-matching", "image-processing", "zncc", "pyramid", "rotation"]
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "README.md",
    "CHANGELOG.md",
    "ROADMAP.md",
    "performance.md",
    "LICENSE",
]

[dependencies]
thiserror.workspace = true
rayon = { workspace = true, optional = true }
wide = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true
criterion.workspace = true
serde_json.workspace = true
serde.workspace = true

[features]
default = []
rayon = ["dep:rayon"]
simd = ["dep:wide"]
image-io = ["dep:image"]
tracing = ["dep:tracing"]

[[bench]]
name = "corrmatch"
harness = false
