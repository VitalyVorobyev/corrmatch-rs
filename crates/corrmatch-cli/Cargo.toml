[package]
name = "corrmatch-cli"
version = "0.2.1"
description = "CLI tool for corrmatch (JSON config driven)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/VitalyVorobyev/corrmatch-rs"
readme = "README.md"
include = [
    "src/**",
    "config.schema.json",
    "config.example.json",
    "README.md",
    "Cargo.toml",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
corrmatch = { version = "0.2.0", path = "../corrmatch", features = ["image-io", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
