[package]
name = "corrmatch"
version = "0.1.0"
description = "CPU-first template matching with ZNCC/SSD and coarse-to-fine pyramid search"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/corrmatch-rs"
homepage = "https://github.com/VitalyVorobyev/corrmatch-rs"
documentation = "https://docs.rs/corrmatch"
readme = "README.md"
categories = ["algorithms", "multimedia::images", "science"]
keywords = ["template-matching", "image-processing", "zncc", "pyramid", "rotation"]
rust-version = "1.70"
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "docs/**",
    "/README.md",
    "/CHANGELOG.md",
    "/ROADMAP.md",
    "/performance.md",
    "/LICENSE",
    "/rustfmt.toml",
    "/Cargo.toml",
]

[dependencies]
thiserror = "1"
rayon = { version = "1", optional = true }
wide = { version = "1", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
rand = "0.9"
criterion = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[features]
default = []
rayon = ["dep:rayon"]
simd = ["dep:wide"]
image-io = ["dep:image"]
tracing = ["dep:tracing"]

[workspace]
members = ["corrmatch-cli", "corrmatch-py"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/corrmatch-rs"

[[bench]]
name = "corrmatch"
harness = false
