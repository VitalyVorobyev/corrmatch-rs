[workspace]
members = ["crates/corrmatch", "crates/corrmatch-cli", "crates/corrmatch-py"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/corrmatch-rs"
homepage = "https://vitalyvorobyev.github.io/corrmatch-rs/"
documentation = "https://vitalyvorobyev.github.io/corrmatch-rs/"
rust-version = "1.91"
version = "0.2.2"

[workspace.dependencies]
thiserror = "1"
rayon = { version = "1" }
wide = { version = "1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
criterion = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
ndarray = "0.17"
pyo3-build-config = "0.29"

corrmatch = { version = "0.2", path = "crates/corrmatch", features = ["image-io", "tracing", "rayon", "simd"] }
