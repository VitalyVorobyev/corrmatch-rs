[mypy]
python_version = 3.10
strict = True

[mypy-matplotlib]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-PIL]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

# viz.py is an optional visualization helper. Its numpy ndarray signatures
# use the loose `np.ndarray` form that stricter numpy stubs (notably on
# Python 3.10) flag under --strict. The core library in corrmatch itself is
# fully typed; viz-only type looseness is not worth the churn.
[mypy-corrmatch.viz]
disable_error_code = type-arg, no-untyped-call, no-any-return
